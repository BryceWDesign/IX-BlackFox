name: Wave 16 Cryptographic Authority

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-authority:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and contract-test dependencies
        run: python -m pip install -e ".[dev,aws-kms]"

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Strict typing
        run: python -m mypy src

      - name: Full suite
        run: python -m pytest -q

      - name: Real local signed authority proof
        run: python scripts/run_wave16_crypto_authority_ci.py --root .

      - name: Stage public proof artifacts
        id: stage-proofs
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import shutil

          source = Path(".blackfox-artifacts") / "wave16"
          target = Path("wave16-artifacts")

          if target.exists():
              shutil.rmtree(target)

          files = sorted(source.glob("*.json"))

          if not files:
              raise SystemExit(
                  f"No Wave 16 proof JSON files found at {source.resolve()}"
              )

          target.mkdir(parents=True, exist_ok=True)

          for artifact in files:
              shutil.copy2(artifact, target / artifact.name)

          print(f"Staged {len(files)} Wave 16 public proof artifact(s):")
          for artifact in files:
              print(f"  {artifact.name}")

      - name: Public proof artifacts
        if: always() && steps.stage-proofs.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wave16-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: wave16-artifacts/*.json
          if-no-files-found: error