name: Wave 18 Governed Autonomy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operations:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Governed operations and independent provider observation
        run: python -m pytest -q tests/autonomy --junitxml=wave18-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave18-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: wave18-results.xml
          if-no-files-found: error
