name: Wave 7 Model Repair Evidence

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  wave7-model-repair-evidence:
    name: Wave 7 model repair evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" || python -m pip install -e .

      - name: Run Wave 7 brain and repair evidence tests
        run: |
          python -m pytest \
            tests/brains \
            tests/runtime/test_brain_proposal.py \
            tests/runtime/test_brain_repair.py \
            tests/runtime/test_brain_repair_evidence.py \
            tests/ci/test_wave7_model_repair_ci_integration.py \
            -q

      - name: Generate Wave 7 model repair CI evidence
        run: |
          python scripts/run_wave7_model_repair_ci.py --head-sha "${{ github.sha }}"

      - name: Upload Wave 7 model repair evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: wave7-model-repair-ci-evidence
          path: .blackfox-artifacts/wave7/
          if-no-files-found: error
