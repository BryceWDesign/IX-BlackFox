name: Wave 17 Enterprise Integration Mesh

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enterprise-mesh:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and validation tools
        run: python -m pip install -e ".[dev,aws-kms]"
      - name: Lint
        run: python -m ruff check .
      - name: Strict typing
        run: python -m mypy src
      - name: Complete suite
        run: python -m pytest -q
      - name: Real HTTP enterprise integration proof
        run: python scripts/run_wave17_integration_mesh_ci.py --root .
      - name: Stage public evidence
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import shutil
          source = Path(".blackfox-artifacts/wave17")
          target = Path("wave17-public-evidence")
          target.mkdir(exist_ok=True)
          for artifact in source.glob("*.json"):
              shutil.copy2(artifact, target / artifact.name)
      - name: Upload public proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave17-${{ matrix.os }}-${{ matrix.python-version }}
          path: wave17-public-evidence/*.json
          if-no-files-found: error
