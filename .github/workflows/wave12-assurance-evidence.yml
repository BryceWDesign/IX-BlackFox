name: Wave 12 Assurance Evidence

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave12-assurance-evidence:
    name: Wave 12 certification-ready evidence package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with development tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Wave 12 adversarial and package tests
        run: |
          python -m pytest \
            tests/assurance \
            tests/ci/test_wave12_assurance_runner_contract.py \
            tests/ci/test_wave12_assurance_workflow_contract.py \
            tests/docs/test_wave12_assurance_docs.py \
            -q

      - name: Compile Wave 12 implementation
        run: |
          python -m compileall -q \
            src/ix_blackfox/assurance \
            scripts/run_wave12_assurance_ci.py \
            tests/assurance \
            tests/ci/test_wave12_assurance_runner_contract.py \
            tests/ci/test_wave12_assurance_workflow_contract.py \
            tests/docs/test_wave12_assurance_docs.py

      - name: Regenerate and verify Wave 12 assurance evidence
        run: |
          python scripts/run_wave12_assurance_ci.py \
            --root "." \
            --head-sha "${{ github.sha }}" \
            --expected-status "review_required"

      - name: Upload Wave 12 evidence package
        uses: actions/upload-artifact@v4
        with:
          name: wave12-assurance-evidence
          path: |
            .blackfox-artifacts/wave12/wave12-certification-ready-evidence.zip
            .blackfox-artifacts/wave12/wave12-package-verification.json
            .blackfox-artifacts/wave12/wave12-assurance-readiness-report.json
            .blackfox-artifacts/wave12/wave12-assurance-crosswalk.json
            .blackfox-artifacts/wave12/wave12-assurance-manifest.json
            .blackfox-artifacts/wave12/wave12-evidence-spec.json
            .blackfox-artifacts/wave12/wave12-assurance-ci-summary.json
          if-no-files-found: error
