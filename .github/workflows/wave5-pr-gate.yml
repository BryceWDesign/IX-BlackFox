name: IX-BlackFox Wave 5 PR Gate

on:
  workflow_dispatch:
    inputs:
      evidence_pack_path:
        description: Path to the PR evidence-pack JSON file committed or restored into the workspace.
        required: true
        default: artifacts/wave5/pr-evidence-pack.json
      ci_evidence_path:
        description: Path to the CI evidence JSON file committed or restored into the workspace.
        required: true
        default: artifacts/wave5/ci-evidence.json
      required_checks:
        description: Newline-delimited CI check names that must pass in the CI evidence bundle.
        required: false
        default: pytest

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ix-blackfox-wave5-pr-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wave5-pr-gate:
    name: Wave 5 PR evidence gate
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      EVIDENCE_PACK_PATH: ${{ inputs.evidence_pack_path }}
      CI_EVIDENCE_PATH: ${{ inputs.ci_evidence_path }}
      REQUIRED_CHECKS_INPUT: ${{ inputs.required_checks }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project with pinned dev tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Run Wave 5 PR gate
        run: |
          set -euo pipefail
          required_args=()
          while IFS= read -r check_name; do
            if [ -n "$check_name" ]; then
              required_args+=(--required-check "$check_name")
            fi
          done <<< "$REQUIRED_CHECKS_INPUT"

          python -m ix_blackfox.interface.cli workflow pr-gate \
            --evidence-pack "$EVIDENCE_PACK_PATH" \
            --ci-evidence "$CI_EVIDENCE_PATH" \
            "${required_args[@]}" \
            --json | tee wave5-pr-gate-decision.json

      - name: Upload Wave 5 gate decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave5-pr-gate-decision
          path: wave5-pr-gate-decision.json
          if-no-files-found: ignore
