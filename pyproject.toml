[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ix-blackfox"
version = "0.4.1"
description = "Evidence-conditioned authority gateway and governed AI engineering control plane."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Bryce Lovell" }
]
keywords = [
  "ai-governance",
  "runtime-assurance",
  "patch-test-verify",
  "software-verification",
  "evidence-bundles",
  "mcp-gateway",
  "agent-authorization"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Private :: Do Not Upload",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "PyJWT[crypto]>=2.10,<3.0",
  "cryptography>=46,<51"
]

[project.optional-dependencies]
aws-kms = ["boto3>=1.35,<2"]
hsm = ["python-pkcs11>=0.7,<0.11"]
dev = [
  "mypy>=1.10,<2.0",
  "pytest>=8.2,<10.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.5.0,<0.6.0",
  "jsonschema>=4.22,<5"
]

[project.scripts]
blackfox = "ix_blackfox.interface.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config"
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "N"
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "N803", "N806"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
